baseURL: 'https://shpandrak.github.io/'

#languageCode: en-us
title: ShpanBlog
theme: ["PaperMod"]
languageCode: "he"
defaultContentLanguage: "he"

markup:
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

# Add these lines to enable comments globally
params:
  # Must stay set: PaperMod's rss.xml falls back to the removed site.Author
  # when params.author is absent, which breaks the build on Hugo >= 0.165.
  author: "Shpandrak"
  comments: true
  ShowShareButtons: true
  ShareButtons: [ "whatsapp", "facebook", "x", "telegram" ]

  assets:
    favicon: favicon.svg


taxonomies:
  tag: tags
  category: categories
  series: series

services:
  googleAnalytics:
    id: G-W3QGVVYBR4

menu:
  main:
    - identifier: archive
      name: ארכיון
      url: /archives/
    - identifier: trips
      name: טיולים
      url: /posts/
    - identifier: search
      name: חיפוש
      url: /search
